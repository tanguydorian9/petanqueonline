<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Côtes-d'Armor (22) - Smart Zone</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        /* --- STYLES GÉNÉRAUX --- */
        body {
            font-family: 'Outfit', sans-serif; margin: 0; padding: 0; height: 100vh; overflow-x: hidden;
            color: #2d3436;
            background: linear-gradient(-45deg, #eef2f3, #8e9eab, #eef2f3);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .app-layout {
            display: grid; grid-template-columns: 350px 1fr; gap: 40px;
            max-width: 1250px; margin: 40px auto; padding: 0 20px;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        /* --- SIDEBAR --- */
        .sidebar { padding: 30px; text-align: center; height: fit-content; position: sticky; top: 20px; }

        .header-dept { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 20px; }
        
        .dept-number {
            font-size: 4em; font-weight: 800; line-height: 1;
            /* COULEUR 22 : VIOLET / ROSE */
            background: linear-gradient(45deg, #834d9b, #d04ed6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .dept-name { font-size: 1.5em; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; text-align: left;}

        .btn-home { display: inline-block; margin-bottom: 10px; text-decoration: none; color: #636e72; font-weight: 500; background: white; padding: 5px 15px; border-radius: 20px; font-size: 0.8em; transition: 0.3s; }
        .btn-home:hover { transform: scale(1.05); color: #834d9b; }

        /* --- WIDGETS (Carte, Météo, Recherche) --- */
        .city-search-box { position: relative; margin-bottom: 10px; }
        .city-input {
            width: 100%; padding: 10px 15px; border-radius: 12px; border: 2px solid white;
            background: rgba(255,255,255,0.6); font-family: inherit; font-size: 0.9em;
            box-sizing: border-box; transition: 0.3s;
        }
        .city-input:focus { outline: none; border-color: #834d9b; background: white; }
        
        .city-results {
            position: absolute; top: 110%; left: 0; width: 100%; background: white;
            border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            max-height: 150px; overflow-y: auto; z-index: 500; display: none; text-align: left;
        }
        .city-result-item { padding: 8px 12px; cursor: pointer; font-size: 0.9em; border-bottom: 1px solid #eee; }
        .city-result-item:hover { background: #f0f2f5; color: #834d9b; }

        #map-widget {
            height: 180px; width: 100%; border-radius: 15px; margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); z-index: 1;
        }

        .weather-widget {
            /* DÉGRADÉ VIOLET */
            background: linear-gradient(135deg, #d04ed6, #834d9b);
            color: white; padding: 15px; border-radius: 15px; margin-bottom: 20px;
            text-align: left; position: relative; overflow: hidden;
            box-shadow: 0 10px 20px rgba(131, 77, 155, 0.3); transition: transform 0.3s;
        }
        .weather-widget:hover { transform: translateY(-2px); }
        .weather-header { display: flex; justify-content: space-between; align-items: center; }
        .weather-temp { font-size: 2em; font-weight: 800; }
        .weather-icon { font-size: 2.5em; opacity: 0.9; }
        .weather-city { font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; opacity: 0.9; }
        .weather-desc { font-size: 0.85em; font-weight: 500; margin-top: 5px; opacity: 0.9;}
        
        .badge-live { background: #ff7675; padding: 2px 6px; border-radius: 4px; font-size: 0.6em; vertical-align: middle; margin-left: 5px; }

        /* --- BOUTONS --- */
        .btn-join {
            margin-top: 10px; width: 100%; padding: 12px; border: none; border-radius: 15px;
            background: linear-gradient(45deg, #834d9b, #d04ed6);
            color: white; font-weight: 800; text-transform: uppercase; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 10px 20px rgba(131, 77, 155, 0.3);
        }
        .btn-join:hover { transform: translateY(-3px) scale(1.02); }
        .btn-join.joined { background: #00b894; box-shadow: none; cursor: default; }
        
        .btn-leave {
            margin-top: 10px; width: 100%; padding: 10px; border: 2px solid #ff7675; border-radius: 15px;
            background: transparent; color: #ff7675; font-weight: 700; cursor: pointer; display: none; transition: 0.3s;
        }
        .btn-leave:hover { background: #ff7675; color: white; }

        /* --- FORUM --- */
        .topic {
            padding: 25px; margin-bottom: 25px; position: relative;
            transition: transform 0.3s; animation: slideUp 0.5s ease-out forwards; opacity: 0;
        }
        @keyframes slideUp { from {opacity:0; transform:translateY(30px);} to {opacity:1; transform:translateY(0);} }
        .topic:hover { transform: translateY(-5px) scale(1.01); background: rgba(255, 255, 255, 0.95); }

        .topic-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .tag { font-size: 0.7em; font-weight: 800; text-transform: uppercase; padding: 5px 12px; border-radius: 30px; }
        .tag-Tournoi { background: #dff9fb; color: #130f40; } .tag-Terrain { background: #fefce8; color: #d35400; }
        .tag-Vente { background: #ffeaa7; color: #6c5ce7; } .tag-Autre { background: #dfe6e9; color: #636e72; }

        .btn-delete { background: none; border: none; font-size: 1.2em; color: #ff7675; cursor: pointer; opacity: 0; transition: 0.2s; }
        .topic:hover .btn-delete { opacity: 1; }
        .topic h3 { margin: 10px 0; font-size: 1.3em; color: #2d3436; }
        .topic-footer { border-top: 1px solid rgba(0,0,0,0.05); padding-top: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9em; color: #b2bec3; }
        .user { display: flex; align-items: center; gap: 10px; font-weight: 600; color: #2d3436; }
        
        /* AVATAR ROND CLASSIQUE (VIOLET) */
        .user-avatar { 
            width: 35px; height: 35px; border-radius: 50%; 
            background: linear-gradient(135deg, #834d9b 0%, #d04ed6 100%);
            color: white; display: flex; align-items: center; justify-content: center;
            font-weight: 800; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .like-btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 5px; color: #b2bec3; font-weight: bold; transition: 0.2s; }
        .like-btn:hover { color: #ff7675; } .like-btn.liked { color: #ff4757; }

        /* --- FORMULAIRE & MODALE --- */
        .fab { position: fixed; bottom: 40px; right: 40px; background: white; color: #834d9b; width: 70px; height: 70px; border-radius: 50%; font-size: 35px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.2); cursor: pointer; transition: 0.3s; z-index: 100; }
        .fab:hover { transform: rotate(90deg) scale(1.1); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 200; }
        .form-input { width: 100%; padding: 15px; margin-bottom: 15px; border: 2px solid #f1f2f6; border-radius: 12px; background: #fdfdfd; font-family: inherit; box-sizing: border-box; transition: 0.3s; }
        .form-input:focus { border-color: #834d9b; outline: none; }
        .btn-submit { width: 100%; padding: 15px; background: #834d9b; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.1em; }
        
        .input-group { position: relative; }
        .btn-mic {
            position: absolute; right: 10px; top: 10px;
            background: #eee; border: none; width: 35px; height: 35px;
            border-radius: 50%; cursor: pointer; font-size: 1.2em;
            transition: 0.3s;
        }
        .btn-mic.listening { background: #ff7675; color: white; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 118, 117, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(255, 118, 117, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 118, 117, 0); } }

    </style>
</head>
<body>

    <div class="app-layout">
        <aside class="sidebar glass-panel">
            <a href="../index.html" class="btn-home">⬅ Carte</a>
            
            <div class="header-dept">
                <div class="dept-number">22</div>
                <div class="dept-name">Côtes-d'Armor</div>
            </div>

            <div class="city-search-box">
                <input type="text" id="cityInput" class="city-input" placeholder="📍 Changer de ville...">
                <div id="cityResults" class="city-results"></div>
            </div>

            <div id="map-widget"></div>

            <div class="weather-widget">
                <span class="weather-city" id="w-city">Saint-Brieuc</span>
                <div class="weather-header">
                    <div class="weather-temp" id="w-temp">--°</div>
                    <div class="weather-icon" id="w-icon">⏳</div>
                </div>
                <div class="weather-desc" id="w-text">Chargement météo...</div>
            </div>

            <button id="btnJoin" class="btn-join">🎉 Rejoindre l'équipe</button>
            <button id="btnLeave" class="btn-leave">💔 Quitter l'équipe</button>
            
            <br><br>
            <button onclick="clearAll()" style="border:none;background:none;color:#aaa;cursor:pointer;font-size:0.8em;text-decoration:underline;">Reset</button>
        </aside>

        <main>
            <h2 class="feed-title">Discussions locales 💬</h2>
            <div id="feed-container"></div>
        </main>
    </div>

    <button class="fab" onclick="openModal()">+</button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="glass-panel" style="padding: 40px; width: 90%; max-width: 500px; position:relative;">
            <button onclick="closeModal()" style="position:absolute; top:20px; right:20px; border:none; background:none; font-size:1.5em; cursor:pointer;">×</button>
            <h2 style="margin-top:0; color:#2d3436;">Lancer un sujet (22)</h2>
            
            <form id="newTopicForm">
                <input type="text" id="inputPseudo" class="form-input" placeholder="Votre pseudo" required>
                <select id="inputTag" class="form-input">
                    <option value="Autre">Choisir une catégorie...</option>
                    <option value="Tournoi">🏆 Tournoi</option>
                    <option value="Terrain">📍 Terrain</option>
                    <option value="Vente">💰 Vente</option>
                    <option value="Autre">💬 Autre</option>
                </select>
                <input type="text" id="inputTitre" class="form-input" placeholder="Titre du sujet" required>
                <div class="input-group">
                    <textarea id="inputMessage" rows="3" class="form-input" placeholder="Votre message... (ou utilisez le micro)" required></textarea>
                    <button type="button" class="btn-mic" id="btnMic" title="Dictée vocale">🎙️</button>
                </div>
                <button type="submit" class="btn-submit">Envoyer 🚀</button>
            </form>
        </div>
    </div>

    <script>
        // --- CONFIGURATION PAR DÉFAUT (Saint-Brieuc) ---
        let currentLat = 48.51;
        let currentLon = -2.76;
        let currentCity = "Saint-Brieuc";
        let map;
        let marker;
        
        // Clé mémoire pour le 22
        const STORAGE_KEY = 'topics_22';
        const MEMBER_KEY = 'isMember_22';

        document.addEventListener('DOMContentLoaded', () => {
            loadTopics();
            initMap();
            fetchRealWeather();
            if(localStorage.getItem(MEMBER_KEY) === 'true') { setMemberState(true); }
        });

        /* --- 1. CARTE LEAFLET (Map) --- */
        function initMap() {
            map = L.map('map-widget', { zoomControl: false }).setView([currentLat, currentLon], 10);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OSM' }).addTo(map);
            marker = L.marker([currentLat, currentLon]).addTo(map).bindPopup("<b>Préfecture</b><br>On pointe ici !").openPopup();
        }

        /* --- 2. RECHERCHE VILLE (API GeoGouv) --- */
        const cityInput = document.getElementById('cityInput');
        const cityResults = document.getElementById('cityResults');

        cityInput.addEventListener('input', async function() {
            const query = this.value;
            if(query.length < 3) { cityResults.style.display = 'none'; return; }

            const res = await fetch(`https://api-adresse.data.gouv.fr/search/?q=${query}&limit=5&type=municipality`);
            const data = await res.json();

            cityResults.innerHTML = '';
            cityResults.style.display = 'block';

            data.features.forEach(feature => {
                const div = document.createElement('div');
                div.className = 'city-result-item';
                div.innerText = `${feature.properties.label} (${feature.properties.context})`;
                div.addEventListener('click', () => {
                    updateLocation(feature.geometry.coordinates[1], feature.geometry.coordinates[0], feature.properties.label);
                    cityResults.style.display = 'none';
                    cityInput.value = '';
                });
                cityResults.appendChild(div);
            });
        });

        function updateLocation(lat, lon, name) {
            currentLat = lat; currentLon = lon; currentCity = name;
            map.flyTo([lat, lon], 12);
            marker.setLatLng([lat, lon]).bindPopup(`<b>${name}</b><br>Nouveau spot !`).openPopup();
            fetchRealWeather();
        }

        /* --- 3. MÉTÉO LIVE (Open-Meteo) --- */
        async function fetchRealWeather() {
            document.getElementById('w-city').innerText = currentCity;
            document.getElementById('w-text').innerText = "Chargement...";
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${currentLat}&longitude=${currentLon}&current_weather=true`);
                const data = await res.json();
                const code = data.current_weather.weathercode;
                const temp = Math.round(data.current_weather.temperature);
                
                let icon = '☁️', text = 'Nuageux';
                if (code === 0) { icon = '☀️'; text = 'Grand soleil !'; }
                else if (code > 50) { icon = '🌧️'; text = 'Pluie probable'; }
                
                document.getElementById('w-temp').innerText = temp + "°C";
                document.getElementById('w-icon').innerText = icon;
                document.getElementById('w-text').innerText = text;
            } catch (e) { console.error(e); }
        }

        /* --- 4. IA TAGGING --- */
        const titreInput = document.getElementById('inputTitre');
        const tagSelect = document.getElementById('inputTag');
        titreInput.addEventListener('input', function() {
            const val = this.value.toLowerCase();
            if (val.includes('vends') || val.includes('achat')) tagSelect.value = 'Vente';
            else if (val.includes('tournoi') || val.includes('match')) tagSelect.value = 'Tournoi';
            else if (val.includes('terrain') || val.includes('pluie')) tagSelect.value = 'Terrain';
        });

        /* --- 5. FORUM (AVEC AVATAR CLASSIQUE) --- */
        function displayTopic(topic) {
            const container = document.getElementById('feed-container');
            const initial = topic.pseudo.charAt(0).toUpperCase();
            
            const html = `
            <div class="glass-panel topic" id="${topic.id}">
                <div class="topic-header">
                    <span class="tag tag-${topic.tag}">${topic.tag}</span>
                    <button class="btn-delete" onclick="deleteTopic(${topic.id})">✖</button>
                </div>
                <h3>${topic.titre}</h3>
                <p>${topic.message}</p>
                <div class="topic-footer">
                    <div class="user">
                        <div class="user-avatar">${initial}</div>
                        ${topic.pseudo}
                    </div>
                    <button class="like-btn" onclick="toggleLike(${topic.id}, this)"><span>❤️</span> ${topic.likes || 0}</button>
                </div>
            </div>`;
            container.insertAdjacentHTML('beforeend', html);
        }
        
        function loadTopics() {
            const container = document.getElementById('feed-container');
            container.innerHTML = "";
            let topics = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            if (topics.length === 0) {
                topics.push({ id: Date.now(), pseudo: "Admin22", tag: "Autre", titre: "Bienvenue dans le 22 !", message: "Profitez de toutes les nouvelles fonctionnalités Smart !", likes: 22, date: "À l'instant" });
                localStorage.setItem(STORAGE_KEY, JSON.stringify(topics));
            }
            topics.slice().reverse().forEach(displayTopic);
            updateCount();
        }

        /* --- 6. AUTRES (Micro, Confetti, Join) --- */
        const btnMic = document.getElementById('btnMic');
        const messageInput = document.getElementById('inputMessage');
        if ('webkitSpeechRecognition' in window) {
            const recognition = new webkitSpeechRecognition(); recognition.lang = 'fr-FR';
            btnMic.addEventListener('click', () => { recognition.start(); btnMic.classList.add('listening'); });
            recognition.onresult = (e) => { messageInput.value += e.results[0][0].transcript + " "; btnMic.classList.remove('listening'); };
        } else { btnMic.style.display = 'none'; }

        const btnJoin = document.getElementById('btnJoin');
        const btnLeave = document.getElementById('btnLeave');
        btnJoin.addEventListener('click', function() {
            // Confettis Violets pour le 22
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#834d9b', '#d04ed6'] });
            setMemberState(true); localStorage.setItem(MEMBER_KEY, 'true');
        });
        btnLeave.addEventListener('click', function() {
            if(confirm("Partir ?")) { 
                pluieDeLarmes();
                setMemberState(false); localStorage.setItem(MEMBER_KEY, 'false'); 
            }
        });
        function setMemberState(is) {
            btnJoin.style.display = is ? 'none' : 'block';
            btnLeave.style.display = is ? 'block' : 'none';
        }
        function pluieDeLarmes() {
            var end = Date.now() + 2000;
            (function frame() {
                confetti({ particleCount: 5, angle: 270, spread: 90, origin: { y: 0 }, colors: ['#a29bfe', '#74b9ff'], startVelocity: 55, gravity: 1.5, shapes: ['square'], scalar: 0.8 });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        document.getElementById('newTopicForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const newTopic = { id: Date.now(), pseudo: document.getElementById('inputPseudo').value, tag: document.getElementById('inputTag').value, titre: document.getElementById('inputTitre').value, message: document.getElementById('inputMessage').value, likes: 0, date: new Date().toLocaleDateString() };
            let topics = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            topics.push(newTopic); localStorage.setItem(STORAGE_KEY, JSON.stringify(topics));
            loadTopics(); closeModal(); this.reset();
        });

        function deleteTopic(id) { if(confirm("Supprimer ?")) { let topics = JSON.parse(localStorage.getItem(STORAGE_KEY)).filter(t => t.id !== id); localStorage.setItem(STORAGE_KEY, JSON.stringify(topics)); loadTopics(); } }
        function toggleLike(id, btn) { let topics = JSON.parse(localStorage.getItem(STORAGE_KEY)); let t = topics.find(x => x.id === id); if(t) { t.likes++; localStorage.setItem(STORAGE_KEY, JSON.stringify(topics)); loadTopics(); } }
        function clearAll() { if(confirm("Reset ?")) { localStorage.removeItem(STORAGE_KEY); loadTopics(); } }
        function updateCount() { document.getElementById('topic-count').innerText = JSON.parse(localStorage.getItem(STORAGE_KEY))?.length || 0; }
        const modal = document.getElementById('modalOverlay');
        function openModal() { modal.style.display = 'flex'; }
        function closeModal() { modal.style.display = 'none'; }
        modal.addEventListener('click', (e) => { if(e.target === modal) closeModal(); });

    </script>
</body>
</html>
