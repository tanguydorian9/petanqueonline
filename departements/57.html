<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moselle (57) - Espace Membres</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- STYLES DE BASE --- */
        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow-x: hidden;
            color: #2d3436;
            background: linear-gradient(-45deg, #eef2f3, #8e9eab, #eef2f3);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .app-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 40px;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        /* --- SIDEBAR --- */
        .sidebar {
            padding: 40px 30px;
            text-align: center;
            height: fit-content;
            position: sticky;
            top: 40px;
        }

        .dept-number {
            font-size: 6em;
            font-weight: 800;
            line-height: 0.9;
            /* Couleur Jaune/Or Mirabelle pour le 57 */
            background: linear-gradient(45deg, #f79f1f, #ffc312);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .dept-name {
            font-size: 1.8em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #2d3436;
        }

        .btn-home {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #636e72;
            font-weight: 500;
            background: white;
            padding: 8px 20px;
            border-radius: 20px;
            transition: 0.3s;
        }
        .btn-home:hover { transform: scale(1.05); color: #f79f1f; }

        /* --- FIL DE DISCUSSION --- */
        .feed-title {
            color: #2d3436; 
            margin-bottom: 20px;
        }

        .topic {
            padding: 25px;
            margin-bottom: 25px;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            animation: slideUp 0.5s ease-out forwards;
            opacity: 0;
        }

        @keyframes slideUp { from {opacity:0; transform:translateY(30px);} to {opacity:1; transform:translateY(0);} }

        .topic:hover {
            transform: translateY(-5px) scale(1.01);
            background: rgba(255, 255, 255, 0.95);
        }

        .topic-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .tag {
            font-size: 0.7em;
            font-weight: 800;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 30px;
            letter-spacing: 1px;
        }
        .tag-Tournoi { background: #dff9fb; color: #130f40; }
        .tag-Terrain { background: #fefce8; color: #d35400; }
        .tag-Vente { background: #ffeaa7; color: #6c5ce7; }
        .tag-Autre { background: #dfe6e9; color: #636e72; }

        .btn-delete {
            background: none; border: none; font-size: 1.2em; color: #ff7675; 
            cursor: pointer; opacity: 0; transition: 0.2s;
        }
        .topic:hover .btn-delete { opacity: 1; }

        .topic h3 { margin: 10px 0; font-size: 1.3em; color: #2d3436; }
        .topic p { color: #636e72; line-height: 1.6; margin-bottom: 20px; }

        .topic-footer {
            border-top: 1px solid rgba(0,0,0,0.05);
            padding-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
            color: #b2bec3;
        }

        .user {
            display: flex; align-items: center; gap: 10px; font-weight: 600; color: #2d3436;
        }
        .user-avatar {
            width: 35px; height: 35px; border-radius: 50%;
            /* Avatar Jaune/Orange */
            background: linear-gradient(135deg, #f79f1f 0%, #ffc312 100%);
            color: white; display: flex; align-items: center; justify-content: center;
        }

        .like-btn {
            background: none; border: none; cursor: pointer;
            display: flex; align-items: center; gap: 5px;
            color: #b2bec3; font-family: inherit; font-weight: bold;
            transition: 0.2s;
        }
        .like-btn:hover { color: #ff7675; }
        .like-btn.liked { color: #ff4757; }
        .like-btn.liked span { transform: scale(1.2); }

        .fab {
            position: fixed; bottom: 40px; right: 40px;
            background: white; color: #f79f1f;
            width: 70px; height: 70px; border-radius: 50%;
            font-size: 35px; border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            cursor: pointer; transition: 0.3s; z-index: 100;
        }
        .fab:hover { transform: rotate(90deg) scale(1.1); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 200;
        }
        
        .form-input {
            width: 100%; padding: 15px; margin-bottom: 15px;
            border: 2px solid #f1f2f6; border-radius: 12px;
            background: #fdfdfd; font-family: inherit; box-sizing: border-box;
            transition: 0.3s;
        }
        .form-input:focus { border-color: #f79f1f; outline: none; }

        .btn-submit {
            width: 100%; padding: 15px; background: #f79f1f;
            color: white; border: none; border-radius: 12px;
            font-weight: bold; cursor: pointer; font-size: 1.1em;
            transition: 0.3s;
        }
        .btn-submit:hover { background: #ffc312; box-shadow: 0 10px 20px rgba(247, 159, 31, 0.3); }

    </style>
</head>
<body>

    <div class="app-layout">
        
        <aside class="sidebar glass-panel">
            <a href="../index.html" class="btn-home">⬅ Carte</a>
            <div class="dept-number">57</div>
            <div class="dept-name">Moselle</div>
            <p style="margin-top: 20px; color: #636e72;">
                De la cathédrale de Metz aux rives de la Moselle, la pétanque est une institution !
            </p>
            <div style="margin-top: 30px; font-size: 0.9em; color: #aaa;">
                <strong style="color:#2d3436; font-size: 1.2em;" id="topic-count">0</strong> sujets actifs
            </div>
            <br>
            <button onclick="clearAll()" style="border:none;background:none;color:#ff7675;cursor:pointer;font-size:0.8em;text-decoration:underline;">Reset Tout</button>
        </aside>

        <main>
            <h2 class="feed-title">Discussions Metz & Thionville 💬</h2>
            <div id="feed-container"></div>
        </main>

    </div>

    <button class="fab" onclick="openModal()">+</button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="glass-panel" style="padding: 40px; width: 90%; max-width: 500px; position:relative;">
            <button onclick="closeModal()" style="position:absolute; top:20px; right:20px; border:none; background:none; font-size:1.5em; cursor:pointer;">×</button>
            <h2 style="margin-top:0; color:#2d3436;">Lancer un sujet (57)</h2>
            
            <form id="newTopicForm">
                <input type="text" id="inputPseudo" class="form-input" placeholder="Votre pseudo" required>
                <select id="inputTag" class="form-input">
                    <option value="Tournoi">🏆 Tournoi</option>
                    <option value="Terrain">📍 Terrain</option>
                    <option value="Vente">💰 Vente</option>
                    <option value="Autre">💬 Autre</option>
                </select>
                <input type="text" id="inputTitre" class="form-input" placeholder="Titre du sujet" required>
                <textarea id="inputMessage" rows="3" class="form-input" placeholder="Votre message..." required></textarea>
                <button type="submit" class="btn-submit">Envoyer 🚀</button>
            </form>
        </div>
    </div>

    <script>
        /* --- JAVASCRIPT --- */
        
        // ATTENTION : Clé unique pour le 57
        const STORAGE_KEY = 'topics_57';

        document.addEventListener('DOMContentLoaded', loadTopics);

        function loadTopics() {
            const container = document.getElementById('feed-container');
            container.innerHTML = "";
            let topics = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

            if (topics.length === 0) {
                // Sujet par défaut pour le 57
                topics.push({
                    id: Date.now(),
                    pseudo: "Admin57",
                    tag: "Tournoi",
                    titre: "Concours Place de la République",
                    message: "Grand tournoi amical ce samedi à Metz. Venez nombreux !",
                    likes: 12,
                    date: "À l'instant"
                });
                localStorage.setItem(STORAGE_KEY, JSON.stringify(topics));
            }

            topics.slice().reverse().forEach(displayTopic);
            updateCount();
        }

        function displayTopic(topic) {
            const container = document.getElementById('feed-container');
            const initial = topic.pseudo.charAt(0).toUpperCase();
            
            const html = `
            <div class="glass-panel topic" id="${topic.id}">
                <div class="topic-header">
                    <span class="tag tag-${topic.tag}">${topic.tag}</span>
                    <button class="btn-delete" onclick="deleteTopic(${topic.id})">✖</button>
                </div>
                <h3>${topic.titre}</h3>
                <p>${topic.message}</p>
                <div class="topic-footer">
                    <div class="user">
                        <div class="user-avatar">${initial}</div>
                        ${topic.pseudo}
                    </div>
                    <button class="like-btn" onclick="toggleLike(${topic.id}, this)">
                        <span>❤️</span> ${topic.likes || 0}
                    </button>
                </div>
            </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
        }

        document.getElementById('newTopicForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const newTopic = {
                id: Date.now(),
                pseudo: document.getElementById('inputPseudo').value,
                tag: document.getElementById('inputTag').value,
                titre: document.getElementById('inputTitre').value,
                message: document.getElementById('inputMessage').value,
                likes: 0,
                date: new Date().toLocaleDateString()
            };

            let topics = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            topics.push(newTopic);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(topics));

            loadTopics();
            closeModal();
            this.reset();
        });

        function deleteTopic(id) {
            if(confirm("Supprimer ce message ?")) {
                let topics = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
                topics = topics.filter(t => t.id !== id);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(topics));
                
                const element = document.getElementById(id);
                element.style.transform = "scale(0.9) translateY(20px)";
                element.style.opacity = "0";
                setTimeout(() => loadTopics(), 300);
            }
        }

        function toggleLike(id, btn) {
            let topics = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            const index = topics.findIndex(t => t.id === id);
            if (index !== -1) {
                topics[index].likes = (topics[index].likes || 0) + 1;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(topics));
                btn.classList.add('liked');
                btn.innerHTML = `<span>❤️</span> ${topics[index].likes}`;
            }
        }

        function clearAll() {
            if(confirm("Vraiment tout effacer dans le 57 ?")) {
                localStorage.removeItem(STORAGE_KEY);
                loadTopics();
            }
        }

        function updateCount() {
            const count = JSON.parse(localStorage.getItem(STORAGE_KEY))?.length || 0;
            document.getElementById('topic-count').innerText = count;
        }

        const modal = document.getElementById('modalOverlay');
        function openModal() { modal.style.display = 'flex'; }
        function closeModal() { modal.style.display = 'none'; }
        modal.addEventListener('click', (e) => { if(e.target === modal) closeModal(); });

    </script>
</body>
</html>
