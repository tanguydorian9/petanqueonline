<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finistère (29)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* --- STYLES GÉNÉRAUX --- */
        body {
            font-family: 'Outfit', sans-serif; margin: 0; padding: 0; height: 100vh; overflow-x: hidden;
            color: #2d3436;
            background: linear-gradient(-45deg, #eef2f3, #8e9eab, #eef2f3);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .app-layout {
            display: grid; grid-template-columns: 320px 1fr; gap: 40px;
            max-width: 1200px; margin: 40px auto; padding: 0 20px;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        /* --- SIDEBAR --- */
        .sidebar { padding: 40px 30px; text-align: center; height: fit-content; position: sticky; top: 40px; }

        .dept-number {
            font-size: 6em; font-weight: 800; line-height: 0.9; margin-bottom: 10px;
            background: linear-gradient(45deg, #0984e3, #00cec9);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .dept-name { font-size: 1.8em; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; }

        .btn-home {
            display: inline-block; margin-bottom: 20px; text-decoration: none;
            color: #636e72; font-weight: 500; background: white;
            padding: 8px 20px; border-radius: 20px; transition: 0.3s;
        }
        .btn-home:hover { transform: scale(1.05); color: #0984e3; }

        /* --- WIDGET MÉTÉO (VRAIE LIVE) --- */
        .weather-widget {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            color: white; padding: 20px; border-radius: 15px; margin-top: 20px;
            text-align: left; position: relative; overflow: hidden;
            box-shadow: 0 10px 20px rgba(9, 132, 227, 0.3);
            transition: transform 0.3s;
        }
        .weather-widget:hover { transform: translateY(-2px); }
        .weather-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .weather-temp { font-size: 2.5em; font-weight: 800; line-height: 1; }
        .weather-icon { font-size: 3em; opacity: 0.9; }
        .weather-location { font-size: 0.8em; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; margin-bottom: 5px; display: block;}
        .weather-desc { font-size: 0.95em; font-weight: 500; margin-top: 5px; }
        
        /* Petit badge LIVE */
        .badge-live { background: #ff7675; padding: 2px 6px; border-radius: 4px; font-size: 0.6em; vertical-align: middle; margin-left: 5px; }

        /* --- BOUTONS --- */
        .btn-join {
            margin-top: 25px; width: 100%; padding: 15px; border: none; border-radius: 15px;
            background: linear-gradient(45deg, #0984e3, #00cec9);
            color: white; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.1em;
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 10px 20px rgba(9, 132, 227, 0.3);
        }
        .btn-join:hover { transform: translateY(-3px) scale(1.02); }
        .btn-join.joined { background: #00b894; box-shadow: none; cursor: default; transform: none !important; }
        
        .btn-leave {
            margin-top: 15px; width: 100%; padding: 10px; border: 2px solid #ff7675; border-radius: 15px;
            background: transparent; color: #ff7675; font-weight: 700; cursor: pointer; display: none; transition: 0.3s;
        }
        .btn-leave:hover { background: #ff7675; color: white; }

        /* --- FORUM --- */
        .topic {
            padding: 25px; margin-bottom: 25px; position: relative;
            transition: transform 0.3s; animation: slideUp 0.5s ease-out forwards; opacity: 0;
        }
        @keyframes slideUp { from {opacity:0; transform:translateY(30px);} to {opacity:1; transform:translateY(0);} }
        .topic:hover { transform: translateY(-5px) scale(1.01); background: rgba(255, 255, 255, 0.95); }

        .topic-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .tag { font-size: 0.7em; font-weight: 800; text-transform: uppercase; padding: 5px 12px; border-radius: 30px; }
        .tag-Tournoi { background: #dff9fb; color: #130f40; } .tag-Terrain { background: #fefce8; color: #d35400; }
        .tag-Vente { background: #ffeaa7; color: #6c5ce7; } .tag-Autre { background: #dfe6e9; color: #636e72; }

        .btn-delete { background: none; border: none; font-size: 1.2em; color: #ff7675; cursor: pointer; opacity: 0; transition: 0.2s; }
        .topic:hover .btn-delete { opacity: 1; }
        .topic h3 { margin: 10px 0; font-size: 1.3em; color: #2d3436; }
        .topic-footer { border-top: 1px solid rgba(0,0,0,0.05); padding-top: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9em; color: #b2bec3; }
        .user { display: flex; align-items: center; gap: 10px; font-weight: 600; color: #2d3436; }
        .user-avatar { width: 35px; height: 35px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; display: flex; align-items: center; justify-content: center; }
        .like-btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 5px; color: #b2bec3; font-weight: bold; transition: 0.2s; }
        .like-btn:hover { color: #ff7675; } .like-btn.liked { color: #ff4757; }

        /* --- FORMULAIRE SMART --- */
        .fab { position: fixed; bottom: 40px; right: 40px; background: white; color: #0984e3; width: 70px; height: 70px; border-radius: 50%; font-size: 35px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.2); cursor: pointer; transition: 0.3s; z-index: 100; }
        .fab:hover { transform: rotate(90deg) scale(1.1); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 200; }
        .form-input { width: 100%; padding: 15px; margin-bottom: 15px; border: 2px solid #f1f2f6; border-radius: 12px; background: #fdfdfd; font-family: inherit; box-sizing: border-box; transition: 0.3s; }
        .form-input:focus { border-color: #0984e3; outline: none; }
        .btn-submit { width: 100%; padding: 15px; background: #0984e3; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.1em; }
        
        /* Bouton Micro */
        .input-group { position: relative; }
        .btn-mic {
            position: absolute; right: 10px; top: 10px;
            background: #eee; border: none; width: 35px; height: 35px;
            border-radius: 50%; cursor: pointer; font-size: 1.2em;
            transition: 0.3s;
        }
        .btn-mic.listening { background: #ff7675; color: white; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 118, 117, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(255, 118, 117, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 118, 117, 0); } }

    </style>
</head>
<body>

    <div class="app-layout">
        <aside class="sidebar glass-panel">
            <a href="../index.html" class="btn-home">⬅ Carte</a>
            <div class="dept-number">29</div>
            <div class="dept-name">Finistère</div>
            
            <div class="weather-widget">
                <span class="weather-location">Brest <span class="badge-live">LIVE</span></span>
                <div class="weather-header">
                    <div class="weather-temp" id="w-temp">--°</div>
                    <div class="weather-icon" id="w-icon">⏳</div>
                </div>
                <div class="weather-desc" id="w-text">Chargement météo...</div>
            </div>

            <button id="btnJoin" class="btn-join">🎉 Rejoindre l'équipe</button>
            <button id="btnLeave" class="btn-leave">💔 Quitter l'équipe</button>

            <div style="margin-top: 30px; font-size: 0.9em; color: #aaa;">
                <strong style="color:#2d3436; font-size: 1.2em;" id="topic-count">0</strong> sujets actifs
            </div>
            <br>
            <button onclick="clearAll()" style="border:none;background:none;color:#ff7675;cursor:pointer;font-size:0.8em;text-decoration:underline;">Tout supprimer</button>
        </aside>

        <main>
            <h2 class="feed-title">Les dernières discussions 💬</h2>
            <div id="feed-container"></div>
        </main>
    </div>

    <button class="fab" onclick="openModal()">+</button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="glass-panel" style="padding: 40px; width: 90%; max-width: 500px; position:relative;">
            <button onclick="closeModal()" style="position:absolute; top:20px; right:20px; border:none; background:none; font-size:1.5em; cursor:pointer;">×</button>
            <h2 style="margin-top:0; color:#2d3436;">Lancer un sujet</h2>
            
            <form id="newTopicForm">
                <input type="text" id="inputPseudo" class="form-input" placeholder="Votre pseudo" required>
                
                <select id="inputTag" class="form-input">
                    <option value="Autre">Choisir une catégorie...</option>
                    <option value="Tournoi">🏆 Tournoi</option>
                    <option value="Terrain">📍 Terrain</option>
                    <option value="Vente">💰 Vente</option>
                    <option value="Autre">💬 Autre</option>
                </select>

                <input type="text" id="inputTitre" class="form-input" placeholder="Titre du sujet" required>
                
                <div class="input-group">
                    <textarea id="inputMessage" rows="3" class="form-input" placeholder="Votre message... (ou utilisez le micro)" required></textarea>
                    <button type="button" class="btn-mic" id="btnMic" title="Dictée vocale">🎙️</button>
                </div>

                <button type="submit" class="btn-submit">Envoyer 🚀</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadTopics();
            fetchRealWeather(); // Lancement de la VRAIE météo
            if(localStorage.getItem('isMember_29') === 'true') { setMemberState(true); }
        });

        /* --- 1. FONCTION VRAIE MÉTÉO (API Open-Meteo) --- */
        async function fetchRealWeather() {
            try {
                // On appelle l'API pour BREST (Latitude 48.39, Longitude -4.48)
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=48.39&longitude=-4.48&current_weather=true');
                const data = await response.json();
                
                const temp = Math.round(data.current_weather.temperature);
                const code = data.current_weather.weathercode;
                
                // Interprétation du code météo (WMO)
                let icon = '❓';
                let text = 'Pas de données';
                
                // Tableau de correspondance simple
                if (code === 0) { icon = '☀️'; text = 'Grand soleil, sortez les boules !'; }
                else if (code >= 1 && code <= 3) { icon = '🌥️'; text = 'Quelques nuages, idéal pour jouer.'; }
                else if (code >= 45 && code <= 48) { icon = '🌫️'; text = 'Brumeux, attention à la visibilité.'; }
                else if (code >= 51 && code <= 67) { icon = '🌧️'; text = 'Il pleut ! Terrain gras en vue.'; }
                else if (code >= 71 && code <= 77) { icon = '❄️'; text = 'Neige ? Restez au chaud !'; }
                else if (code >= 80 && code <= 82) { icon = '🚿'; text = 'Averses, prévoyez le K-Way.'; }
                else if (code >= 95) { icon = '⛈️'; text = 'Orage ! Rentrez vite !'; }

                // Mise à jour de l'affichage
                document.getElementById('w-temp').innerText = temp + "°C";
                document.getElementById('w-icon').innerText = icon;
                document.getElementById('w-text').innerText = text;

            } catch (error) {
                console.error("Erreur météo", error);
                document.getElementById('w-text').innerText = "Météo indisponible (Hors ligne)";
            }
        }

        /* --- 2. IA TAGGING --- */
        const titreInput = document.getElementById('inputTitre');
        const tagSelect = document.getElementById('inputTag');

        titreInput.addEventListener('input', function() {
            const val = this.value.toLowerCase();
            if (val.includes('vends') || val.includes('achat') || val.includes('prix')) {
                tagSelect.value = 'Vente';
            } else if (val.includes('tournoi') || val.includes('concours') || val.includes('match')) {
                tagSelect.value = 'Tournoi';
            } else if (val.includes('terrain') || val.includes('boulodrome') || val.includes('pluie')) {
                tagSelect.value = 'Terrain';
            }
        });

        /* --- 3. DICTÉE VOCALE --- */
        const btnMic = document.getElementById('btnMic');
        const messageInput = document.getElementById('inputMessage');

        if ('webkitSpeechRecognition' in window) {
            const recognition = new webkitSpeechRecognition();
            recognition.lang = 'fr-FR'; recognition.continuous = false;

            btnMic.addEventListener('click', () => {
                if (btnMic.classList.contains('listening')) { recognition.stop(); } 
                else { recognition.start(); btnMic.classList.add('listening'); }
            });

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                messageInput.value += transcript + " ";
                btnMic.classList.remove('listening');
            };
            recognition.onend = () => { btnMic.classList.remove('listening'); };
        } else {
            btnMic.style.display = 'none';
        }

        /* --- 4. GESTION CLASSIC (Rejoindre/Quitter) --- */
        const btnJoin = document.getElementById('btnJoin');
        const btnLeave = document.getElementById('btnLeave');

        btnJoin.addEventListener('click', function() {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#0984e3', '#00cec9', '#ffffff', '#fdcb6e'] });
            setMemberState(true);
            localStorage.setItem('isMember_29', 'true');
        });

        btnLeave.addEventListener('click', function() {
            if(confirm("Tu veux vraiment quitter la team 29 ?😥 ")) {
                pluieDeLarmes();
                setMemberState(false);
                localStorage.setItem('isMember_29', 'false');
            }
        });

        function setMemberState(isMember) {
            if(isMember) {
                btnJoin.style.display = 'none'; btnLeave.style.display = 'block';
                btnJoin.innerHTML = "Rejoindre"; btnJoin.classList.remove('joined');
            } else {
                btnJoin.style.display = 'block'; btnLeave.style.display = 'none';
            }
        }

        function pluieDeLarmes() {
            var end = Date.now() + 2000;
            (function frame() {
                confetti({
                    particleCount: 5, angle: 270, spread: 90, origin: { y: 0 },
                    colors: ['#a29bfe', '#74b9ff'], startVelocity: 55, gravity: 1.5,
                    shapes: ['square'], scalar: 0.8
                });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        /* --- 5. FORUM LOGIC --- */
        function loadTopics() {
            const container = document.getElementById('feed-container');
            container.innerHTML = "";
            let topics = JSON.parse(localStorage.getItem('topics_29')) || [];
            if (topics.length === 0) {
                topics.push({ id: Date.now(), pseudo: "Admin", tag: "Autre", titre: "Bienvenue !", message: "Testez la dictée vocale en cliquant sur le micro !", likes: 12, date: "À l'instant" });
                localStorage.setItem('topics_29', JSON.stringify(topics));
            }
            topics.slice().reverse().forEach(displayTopic);
            updateCount();
        }

        function displayTopic(topic) {
            const container = document.getElementById('feed-container');
            const initial = topic.pseudo.charAt(0).toUpperCase();
            const html = `
            <div class="glass-panel topic" id="${topic.id}">
                <div class="topic-header">
                    <span class="tag tag-${topic.tag}">${topic.tag}</span>
                    <button class="btn-delete" onclick="deleteTopic(${topic.id})">✖</button>
                </div>
                <h3>${topic.titre}</h3>
                <p>${topic.message}</p>
                <div class="topic-footer">
                    <div class="user"><div class="user-avatar">${initial}</div> ${topic.pseudo}</div>
                    <button class="like-btn" onclick="toggleLike(${topic.id}, this)"><span>❤️</span> ${topic.likes || 0}</button>
                </div>
            </div>`;
            container.insertAdjacentHTML('beforeend', html);
        }

        document.getElementById('newTopicForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const newTopic = {
                id: Date.now(),
                pseudo: document.getElementById('inputPseudo').value,
                tag: document.getElementById('inputTag').value,
                titre: document.getElementById('inputTitre').value,
                message: document.getElementById('inputMessage').value,
                likes: 0, date: new Date().toLocaleDateString()
            };
            let topics = JSON.parse(localStorage.getItem('topics_29')) || [];
            topics.push(newTopic);
            localStorage.setItem('topics_29', JSON.stringify(topics));
            loadTopics(); closeModal(); this.reset();
        });

        function deleteTopic(id) {
            if(confirm("Supprimer ?")) {
                let topics = JSON.parse(localStorage.getItem('topics_29')) || [];
                topics = topics.filter(t => t.id !== id);
                localStorage.setItem('topics_29', JSON.stringify(topics));
                const el = document.getElementById(id); el.style.opacity = "0"; setTimeout(() => loadTopics(), 300);
            }
        }

        function toggleLike(id, btn) {
            let topics = JSON.parse(localStorage.getItem('topics_29')) || [];
            const index = topics.findIndex(t => t.id === id);
            if (index !== -1) {
                topics[index].likes = (topics[index].likes || 0) + 1;
                localStorage.setItem('topics_29', JSON.stringify(topics));
                btn.classList.add('liked'); btn.innerHTML = `<span>❤️</span> ${topics[index].likes}`;
            }
        }

        function clearAll() { if(confirm("Tout effacer ?")) { localStorage.removeItem('topics_29'); loadTopics(); } }
        function updateCount() { document.getElementById('topic-count').innerText = JSON.parse(localStorage.getItem('topics_29'))?.length || 0; }
        const modal = document.getElementById('modalOverlay');
        function openModal() { modal.style.display = 'flex'; }
        function closeModal() { modal.style.display = 'none'; }
        modal.addEventListener('click', (e) => { if(e.target === modal) closeModal(); });

    </script>
</body>
</html>
