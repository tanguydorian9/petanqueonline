<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>France Pétanque by Dodo</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎱</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- 1. LAYOUT & FOND --- */
        body {
            font-family: 'Outfit', sans-serif;
            margin: 0; padding: 0; height: 100vh; overflow: hidden;
            color: #2d3436;
            background: linear-gradient(-45deg, #eef2f3, #8e9eab, #eef2f3);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
            display: flex;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- 2. SIDEBAR --- */
        .sidebar {
            width: 400px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.8);
            padding: 40px; box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: center;
            box-shadow: 5px 0 30px rgba(0,0,0,0.05); z-index: 10;
        }

        .logo {
            font-size: 1.5em; font-weight: 800; color: #2c3e50;
            text-transform: uppercase; letter-spacing: 2px;
            margin-bottom: 50px; display: flex; align-items: center; gap: 10px;
            cursor: help;
        }

        h1 {
            font-size: 2.8em; margin: 0 0 20px 0; line-height: 1.1;
            background: linear-gradient(45deg, #2c3e50, #3498db);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1em; color: #636e72; margin-bottom: 40px; line-height: 1.6;
        }

        /* Barre recherche */
        .search-container { position: relative; margin-bottom: 40px; }
        .search-input {
            width: 100%; padding: 18px 25px; padding-left: 50px;
            border-radius: 15px; border: 2px solid white;
            background: rgba(255, 255, 255, 0.8);
            font-family: inherit; font-size: 1em; outline: none;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05); transition: 0.3s; box-sizing: border-box;
        }
        .search-input:focus {
            border-color: #3498db; box-shadow: 0 5px 20px rgba(52, 152, 219, 0.15);
        }
        .search-icon {
            position: absolute; left: 20px; top: 50%; transform: translateY(-50%); opacity: 0.5;
        }

        /* Stats */
        .stats-row { display: flex; gap: 20px; }
        .stat-card {
            background: white; padding: 15px 20px; border-radius: 12px;
            flex: 1; box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            transition: transform 0.2s;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-number { font-size: 1.5em; font-weight: 800; color: #3498db; display: block;}
        .stat-label { font-size: 0.8em; color: #999; text-transform: uppercase; font-weight: 700;}

        /* --- 3. CARTE --- */
        .map-wrapper {
            flex: 1; position: relative; display: flex;
            align-items: center; justify-content: center; padding: 20px;
        }

        svg {
            max-height: 90vh; width: 100%; filter: drop-shadow(0 10px 30px rgba(0,0,0,0.1));
        }

        path {
            fill: rgba(255, 255, 255, 0.5); stroke: #ffffff; stroke-width: 1px;
            cursor: pointer; transition: all 0.3s ease;
        }

        g path:hover {
            fill: #3498db; stroke: #3498db; filter: drop-shadow(0 0 15px rgba(52, 152, 219, 0.5));
            transform: scale(1.01); transform-origin: center; z-index: 100;
        }
        
        /* Classe pour l'animation Pulse aléatoire */
        .pulse-effect {
            animation: pulseMap 1.5s ease-out;
            fill: #ff7675 !important;
            transform: scale(1.02);
            transform-origin: center;
            z-index: 50;
        }
        
        @keyframes pulseMap {
            0% { fill: rgba(255,255,255,0.5); transform: scale(1); }
            50% { fill: #ff7675; transform: scale(1.03); filter: drop-shadow(0 0 20px rgba(255, 118, 117, 0.6));}
            100% { fill: rgba(255,255,255,0.5); transform: scale(1); }
        }

        /* --- 4. TOOLTIP & NOTIFICATIONS --- */
        #tooltip {
            position: absolute; display: none; background: rgba(44, 62, 80, 0.95);
            color: white; padding: 10px 20px; border-radius: 50px; font-size: 0.9em;
            pointer-events: none; z-index: 1000; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            backdrop-filter: blur(5px); white-space: nowrap; transform: translate(20px, -50%);
        }

        /* La notification "Toast" en bas à droite */
        .toast-notification {
            position: fixed;
            bottom: 20px;
            right: -300px; /* Caché à droite */
            background: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9em;
            z-index: 200;
            transition: right 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-left: 4px solid #2ecc71;
        }
        .toast-visible { right: 20px; }

        /* Easter Egg */
        .falling-object {
            position: fixed; top: -100px; z-index: 9999;
            pointer-events: none; animation: fall linear forwards;
        }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(120vh) rotate(360deg); }
        }

        /* Mobile */
        @media (max-width: 900px) {
            body { flex-direction: column; height: auto; overflow: visible; }
            .sidebar { width: 100%; padding: 30px 20px; position: relative; }
            .map-wrapper { height: 60vh; }
        }
    </style>
</head>

    <div id="tooltip"></div>

    <div id="toast" class="toast-notification">
        <span style="font-size:1.5em">💬</span>
        <div>
            <strong id="toast-user">Utilisateur</strong><br>
            <span id="toast-message">Message</span>
        </div>
    </div>

    <script>
        const tooltip = document.getElementById('tooltip');
        const departements = document.querySelectorAll('path');
        const searchInput = document.querySelector('.search-input');
        const toast = document.getElementById('toast');

        // --- 1. GESTION DU SURVOL (TOOLTIP) ---
        departements.forEach((dept) => {
            dept.addEventListener('mousemove', function(e) {
                const nom = this.getAttribute('data-nom');
                const numero = this.getAttribute('data-numerodepartement');
                
                tooltip.innerHTML = `${nom} <span style="color:#3498db">(${numero})</span>`;
                tooltip.style.display = 'block';
                tooltip.style.left = e.pageX + 20 + 'px';
                tooltip.style.top = e.pageY + 'px';
            });

            dept.addEventListener('mouseleave', function() {
                tooltip.style.display = 'none';
            });

            // 2. GESTION DU CLIC
            dept.addEventListener('click', function() {
                const numero = this.getAttribute('data-numerodepartement');
                if (numero) {
                    this.classList.add('pulse-effect');
                    setTimeout(() => {
                        window.location.href = 'departements/' + numero + '.html';
                    }, 300);
                }
            });
        });

        // --- 3. MOTEUR DE RECHERCHE ---
        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase().trim();
            departements.forEach(dept => {
                const nom = dept.getAttribute('data-nom').toLowerCase();
                const num = dept.getAttribute('data-numerodepartement').toLowerCase();

                if(val === "") {
                    dept.style.opacity = "1";
                    dept.style.fill = "rgba(255, 255, 255, 0.5)";
                } else if(nom.includes(val) || num.includes(val)) {
                    dept.style.opacity = "1";
                    dept.style.fill = "#ff7675";
                } else {
                    dept.style.opacity = "0.2";
                    dept.style.fill = "rgba(255, 255, 255, 0.5)";
                }
            });
        });

        // --- 4. COMPTEURS ANIMÉS ---
        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        // Lance les compteurs
        animateValue("count-dept", 0, 101, 2000);
        animateValue("count-joueurs", 0, 12450, 2500);

        // --- 5. NOTIFICATIONS FAKE LIVE ---
        const fakeNames = ["Dodo", "Ricardo", "Polochon57", "Jordan B", "Marine LP", "Tonton H"];
        const fakeActions = ["vient de rejoindre le", "a posté dans le", "cherche un apéro dans le"];
        
        function showFakeNotification() {
            const name = fakeNames[Math.floor(Math.random() * fakeNames.length)];
            const action = fakeActions[Math.floor(Math.random() * fakeActions.length)];
            const dept = Math.floor(Math.random() * 95) + 1;

            document.getElementById('toast-user').innerText = name;
            document.getElementById('toast-message').innerText = `${action} ${dept}`;
            
            toast.classList.add('toast-visible');

            // Cacher après 4 secondes
            setTimeout(() => {
                toast.classList.remove('toast-visible');
            }, 4000);

            // Relancer une autre notif dans un temps aléatoire (entre 5 et 15s)
            setTimeout(showFakeNotification, Math.random() * 10000 + 5000);
        }

        // Lancer la première notif après 3 secondes
        setTimeout(showFakeNotification, 3000);


        // --- 6. EASTER EGG ---
        let clickCount = 0;
        const logoTitle = document.querySelector('.logo');
        
        if(logoTitle) {
            logoTitle.addEventListener('click', (e) => {
                e.preventDefault(); 
                clickCount++;
                if (clickCount === 5) {
                    lancerLaPluie();
                    clickCount = 0; 
                }
                setTimeout(() => { clickCount = 0; }, 1000);
            });
        }

        function lancerLaPluie() {
            for (let i = 0; i < 50; i++) {
                const el = document.createElement('div');
                el.innerText = ['🎱', '🟡', '🏆', '🐷'][Math.floor(Math.random()*4)];
                el.classList.add('falling-object');
                el.style.left = Math.random() * 100 + 'vw';
                el.style.fontSize = (Math.random() * 30 + 20) + 'px';
                el.style.animationDuration = (Math.random() * 2 + 1) + 's';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 3000);
            }
        }
    </script>
