<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pétanque Online | Portail Officiel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* --- SYSTÈME DE DESIGN --- */
        :root {
            --bg: #f8fafc;
            --primary: #0f172a; /* Bleu nuit original */
            --accent: #A67B5B;
            --white: #ffffff;
            --text-muted: #64748b;
            --shadow: 0 20px 50px rgba(0,0,0,0.05);
            --card-border: #f1f5f9;
        }

        body.dark-mode {
            --bg: #0f172a;
            --primary: #f8fafc;
            --white: #1e293b;
            --text-muted: #94a3b8;
            --card-border: #334155;
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background 0.3s;
        }

        /* --- NAVIGATION --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 60px;
            height: 90px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--card-border);
        }

        .logo { 
            display: flex;
            align-items: center;
            text-decoration: none;
            height: 100%;
            z-index: 10; /* Pour rester au-dessus du menu centré */
        }

        .logo img {
            height: 40px;
            width: auto;
            display: block;
            object-fit: contain;
            mix-blend-mode: multiply; 
        }

        /* MODIFICATION : CENTRAGE DU MENU */
        .nav-links { 
            display: flex; 
            gap: 40px; 
            position: absolute; /* Sort du flux pour se centrer par rapport au nav */
            left: 50%;
            transform: translateX(-50%);
        }

        .nav-links a { text-decoration: none; color: var(--primary); font-weight: 600; font-size: 1.1rem; transition: 0.3s; }
        .nav-links a:hover { color: var(--accent); }
        
        .nav-right { display: flex; gap: 20px; align-items: center; z-index: 10; }

        .user-menu-wrapper { position: relative; display: inline-block; }
        .account-icon { font-size: 1.8rem; color: var(--primary); text-decoration: none; transition: 0.3s; cursor: pointer; display: flex; align-items: center; }
        .account-icon:hover, .account-icon.active-user { color: var(--accent); }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background-color: white;
            min-width: 180px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.1);
            border-radius: 15px;
            overflow: hidden;
            margin-top: 15px;
            border: 1px solid var(--card-border);
        }

        .dropdown-content a, .dropdown-content button {
            color: var(--primary);
            padding: 12px 20px;
            text-decoration: none;
            display: block;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            width: 100%;
            border: none;
            background: none;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }

        .dropdown-content a:hover, .dropdown-content button:hover { background-color: #f8fafc; color: var(--accent); }
        .btn-logout-menu { border-top: 1px solid var(--card-border) !important; color: #ef4444 !important; }
        .user-menu-wrapper:hover .dropdown-content { display: block; }

        /* --- SECTION HERO --- */
        .hero-container {
            display: flex;
            gap: 30px;
            padding: 40px 60px;
            justify-content: center;
            flex: 1;
        }

        .main-card {
            flex: 1;
            max-width: 750px;
            height: 600px;
            background-color: var(--white);
            border-radius: 40px;
            border: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            position: relative;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            box-shadow: var(--shadow);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .card-left { background-image: url('images/cartedefrancev3.png'); }
        .card-right { background-image: url('images/boulepetanquev2.png'); }

        .main-card:hover { 
            transform: translateY(-15px) scale(1.02); 
            box-shadow: 0 40px 70px rgba(166, 123, 91, 0.15); 
            border-color: var(--accent);
        }

        .bubble-btn {
            background-color: var(--primary);
            color: #ffffff;
            padding: 22px 45px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 1.5rem;
            text-transform: uppercase;
            z-index: 2;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .hover-text {
            position: absolute;
            bottom: 130px;
            font-weight: 600;
            color: var(--primary);
            opacity: 0;
            transform: translateY(15px);
            transition: 0.5s;
            background: rgba(255, 255, 255, 0.9); 
            padding: 8px 18px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
        }

        .main-card:hover .hover-text { opacity: 1; transform: translateY(0); }

        /* --- CARTES DU BAS --- */
        .bottom-nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 40px 60px;
            background: #f1f5f9;
        }

        .nav-card {
            flex: 1;
            height: 160px;
            background: var(--white);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--primary);
            border: 1px solid #e2e8f0;
            transition: all 0.4s ease;
        }

        .nav-card i { font-size: 2rem; margin-bottom: 12px; color: var(--accent); transition: 0.3s; }
        .nav-card span { font-weight: 800; font-size: 1.2rem; text-transform: uppercase; transition: 0.3s; }

        .nav-card:hover {
            background-color: #0f172a; 
            border-color: #0f172a;
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(15, 23, 42, 0.3);
        }

        .nav-card:hover i, 
        .nav-card:hover span {
            color: #ffffff;
        }

        /* --- FOOTER --- */
        footer {
            background-color: var(--white);
            padding: 40px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--card-border);
        }

        .footer-logo img {
            height: 35px;
            width: auto;
            mix-blend-mode: multiply;
        }
        
        .socials { display: flex; gap: 15px; }
        .socials a { 
            width: 45px; height: 45px; border-radius: 12px; background: #f1f5f9; 
            display: flex; align-items: center; justify-content: center;
            color: var(--primary); transition: 0.3s;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">
            <img src="images/logo1.png" alt="Pétanque Online Logo">
        </a>
        <div class="nav-links">
            <a href="carte.html">Forum</a>
            <a href="#">Concours</a>
            <a href="boutique.html">Boutique</a>
            <a href="galerie.html">Galerie</a>
        </div>
        <div class="nav-right">
            <div class="user-menu-wrapper" id="user-menu">
                <div id="logged-out-view">
                    <a href="connexion.html" class="account-icon">
                        <i class="fa-regular fa-circle-user"></i>
                    </a>
                </div>
                <div id="logged-in-view" style="display: none;">
                    <div class="account-icon active-user">
                        <i class="fa-solid fa-circle-user"></i>
                    </div>
                    <div class="dropdown-content">
                        <a href="compte.html">Mon Profil</a>
                        <a href="parametre.html">Paramètres</a>
                        <button onclick="simulateLogout()" class="btn-logout-menu">Déconnexion</button>
                    </div>
                </div>
            </div>
            <a href="parametre.html" style="color: var(--primary); font-size: 1.5rem;"><i class="fa-solid fa-sliders"></i></a>
        </div>
    </nav>

    <main class="hero-container">
        <a href="carte.html" class="main-card card-left">
            <div class="bubble-btn">FORUM</div>
            <div class="hover-text">Viens discuter avec des passionnés près de chez toi !</div>
        </a>
        <a href="#" class="main-card card-right">
            <div class="bubble-btn">Calendrier pétanque</div>
            <div class="hover-text">Trouve ton concours !</div>
        </a>
    </main>

    <section class="bottom-nav">
        <a href="boutique.html" class="nav-card">
            <i class="fa-solid fa-basket-shopping"></i>
            <span>Boutique</span>
        </a>
        <a href="galerie.html" class="nav-card">
            <i class="fa-solid fa-images"></i>
            <span>Galerie</span>
        </a>
        <a href="quisommesnous.html" class="nav-card">
            <i class="fa-solid fa-users"></i>
            <span>Qui sommes nous</span>
        </a>
    </section>

    <footer>
        <div class="footer-info">
            © 2026 Pétanque Online. Tous droits réservés<br>
            petanqueonline@gmail.com
        </div>
        <div class="footer-logo">
            <img src="images/logo1.png" alt="Pétanque Online">
        </div>
        <div class="socials">
            <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#"><i class="fa-brands fa-tiktok"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
        </div>
    </footer>

    <script>
        let isUserLoggedIn = false; 
        function updateUI() {
            const loggedOutView = document.getElementById('logged-out-view');
            const loggedInView = document.getElementById('logged-in-view');
            if (isUserLoggedIn) {
                loggedOutView.style.display = 'none';
                loggedInView.style.display = 'block';
            } else {
                loggedOutView.style.display = 'block';
                loggedInView.style.display = 'none';
            }
        }
        function simulateLogout() {
            isUserLoggedIn = false;
            updateUI();
        }
        updateUI();
    </script>
</body>
</html>
