<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pétanque Online | Portail Officiel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/shared.css">
    <style>
        /* --- SECTION HERO --- */
        .hero-container {
            display: flex;
            gap: 30px;
            padding: 40px 60px;
            justify-content: center;
            flex: 1;
        }

        .main-card {
            flex: 1;
            max-width: 750px;
            height: 600px;
            background-color: var(--white);
            border-radius: 40px;
            border: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            position: relative;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            box-shadow: var(--shadow);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .card-left { background-image: url('images/cartedefrancev3.png'); }
        .card-right { background-image: url('images/boulepetanquev2.png'); }

        .main-card:hover { 
            transform: translateY(-15px) scale(1.02); 
            box-shadow: 0 40px 70px rgba(166, 123, 91, 0.15); 
            border-color: var(--accent);
        }

        .bubble-btn {
            background-color: var(--primary);
            color: #ffffff;
            padding: 22px 45px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 1.5rem;
            text-transform: uppercase;
            z-index: 2;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .hover-text {
            position: absolute;
            bottom: 130px;
            font-weight: 600;
            color: var(--primary);
            opacity: 0;
            transform: translateY(15px);
            transition: 0.5s;
            background: rgba(255, 255, 255, 0.9); 
            padding: 8px 18px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
        }

        .main-card:hover .hover-text { opacity: 1; transform: translateY(0); }

        /* --- CARTES DU BAS --- */
        .bottom-nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 40px 60px;
            background: #f1f5f9;
        }

        .nav-card {
            flex: 1;
            height: 160px;
            background: var(--white);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--primary);
            border: 1px solid #e2e8f0;
            transition: all 0.4s ease;
        }

        .nav-card i { font-size: 2rem; margin-bottom: 12px; color: var(--accent); transition: 0.3s; }
        .nav-card span { font-weight: 800; font-size: 1.2rem; text-transform: uppercase; transition: 0.3s; }

        .nav-card:hover {
            background-color: #0f172a; 
            border-color: #0f172a;
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(15, 23, 42, 0.3);
        }

        .nav-card:hover i, 
        .nav-card:hover span {
            color: #ffffff;
        }

    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">
            <img src="images/logo1.png" alt="Pétanque Online Logo">
        </a>
        <div class="nav-links">
            <a href="carte.html">Forum</a>
            <a href="#">Concours</a>
            <a href="boutique.html">Boutique</a>
            <a href="galerie.html">Galerie</a>
        </div>
        <div class="nav-right">
            <div class="user-menu-wrapper" id="user-menu">
                <div id="logged-out-view">
                    <a href="connexion.html" class="account-icon">
                        <i class="fa-regular fa-circle-user"></i>
                    </a>
                </div>
                <div id="logged-in-view" style="display: none;">
                    <div class="account-icon active-user">
                        <i class="fa-solid fa-circle-user"></i>
                    </div>
                    <div class="dropdown-content">
                        <a href="compte.html">Mon Profil</a>
                        <a href="parametre.html">Paramètres</a>
                        <button onclick="simulateLogout()" class="btn-logout-menu">Déconnexion</button>
                    </div>
                </div>
            </div>
            <a href="parametre.html" style="color: var(--primary); font-size: 1.5rem;"><i class="fa-solid fa-sliders"></i></a>
        </div>
    </nav>

    <main class="hero-container">
        <a href="carte.html" class="main-card card-left">
            <div class="bubble-btn">FORUM</div>
            <div class="hover-text">Viens discuter avec des passionnés près de chez toi !</div>
        </a>
        <a href="#" class="main-card card-right">
            <div class="bubble-btn">Calendrier pétanque</div>
            <div class="hover-text">Trouve ton concours !</div>
        </a>
    </main>

    <section class="bottom-nav">
        <a href="boutique.html" class="nav-card">
            <i class="fa-solid fa-basket-shopping"></i>
            <span>Boutique</span>
        </a>
        <a href="galerie.html" class="nav-card">
            <i class="fa-solid fa-images"></i>
            <span>Galerie</span>
        </a>
        <a href="quisommesnous.html" class="nav-card">
            <i class="fa-solid fa-users"></i>
            <span>Qui sommes nous</span>
        </a>
    </section>

    <footer>
        <div class="footer-info">
            © 2026 Pétanque Online. Tous droits réservés<br>
            petanqueonline@gmail.com
        </div>
        <div class="footer-logo">
            <img src="images/logo1.png" alt="Pétanque Online">
        </div>
        <div class="socials">
            <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#"><i class="fa-brands fa-tiktok"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
        </div>
    </footer>

    <script src="js/shared.js"></script>
</body>
</html>
