<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie | FORUP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc; --primary: #0f172a; --accent: #A67B5B; 
            --white: #ffffff; --text-muted: #64748b; --card-border: #f1f5f9;
            --like-red: #ef4444; --shadow: 0 15px 35px rgba(0,0,0,0.05);
        }
        /* MODE SOMBRE */
        body.dark-mode {
            --bg: #0f172a; --primary: #f8fafc; --white: #1e293b;
            --text-muted: #94a3b8; --card-border: #334155;
        }

        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--primary); transition: background 0.3s; }

        /* --- NAVIGATION --- */
        nav {
            display: flex; align-items: center;
            padding: 0 60px; height: 90px; 
            background: var(--white);
            border-bottom: 1px solid var(--card-border); position: sticky; top: 0; z-index: 1000;
        }
        
        .logo-nav { 
            display: flex; 
            align-items: center; 
            text-decoration: none;
            width: 180px; 
        }
        /* TAILLE DU LOGO FIXÉE À 40PX */
        .logo-nav img { height: 40px; width: auto; }

        .nav-links { 
            display: flex; 
            gap: 35px; 
            flex: 1; 
            justify-content: center; 
        }
        .nav-links a { text-decoration: none; color: var(--primary); font-weight: 600; transition: 0.3s; font-size: 1rem; }
        .nav-links a:hover { color: var(--accent); }

        .nav-right {
            width: 180px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
        }

        /* --- ZONE D'AJOUT --- */
        .upload-section { max-width: 935px; margin: 40px auto; padding: 0 20px; }
        .upload-zone {
            background: var(--white); border: 2px dashed var(--accent);
            border-radius: 24px; padding: 40px; text-align: center;
            cursor: pointer; transition: 0.3s; box-shadow: var(--shadow);
            position: relative;
        }
        
        .upload-card-logo {
            position: absolute;
            top: 20px;
            left: 25px;
            height: 25px;
            width: auto;
            opacity: 0.7;
        }

        #upload-preview { display: none; flex-direction: row; align-items: center; gap: 30px; text-align: left; }
        .preview-img-container { width: 140px; height: 140px; border-radius: 12px; overflow: hidden; border: 2px solid var(--accent); flex-shrink: 0; }
        .preview-img-container img { width: 100%; height: 100%; object-fit: cover; }
        
        .upload-form { flex: 1; display: flex; flex-direction: column; gap: 12px; }
        .upload-form input[type="text"] { 
            padding: 12px; border-radius: 10px; border: 1px solid var(--card-border); 
            background: var(--bg); color: var(--primary); font-family: inherit; width: 100%;
        }
        .btn-publish { background: var(--primary); color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-publish:hover { background: var(--accent); transform: scale(1.05); }

        /* --- TABS GALERIE --- */
        .tabs { display: flex; justify-content: center; gap: 60px; margin: 30px 0; border-top: 1px solid var(--card-border); padding-top: 20px; }
        .tab { cursor: pointer; font-size: 1.1rem; font-weight: 800; color: var(--text-muted); transition: 0.3s; padding: 10px; }
        .tab.active { color: var(--primary); border-bottom: 3px solid var(--accent); }

        /* --- GRILLE --- */
        .grid { max-width: 935px; margin: 0 auto 50px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 0 20px; }
        .post-card { background: var(--white); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); cursor: pointer; transition: 0.3s; }
        .post-card.private-style { border: 2px solid var(--accent); }
        .post-card:hover { transform: translateY(-5px); }
        
        .img-box { width: 100%; aspect-ratio: 1/1; overflow: hidden; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .post-info { padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .stats { display: flex; gap: 12px; font-weight: 700; font-size: 0.9rem; }
        .private-label { color: var(--accent); font-size: 0.75rem; font-weight: 800; display: flex; align-items: center; gap: 4px; }

        /* --- MODALE --- */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; 
        }
        .modal-container { background: var(--white); display: flex; width: 90%; max-width: 1100px; height: 80vh; border-radius: 15px; overflow: hidden; position: relative; }
        .modal-left { flex: 1.5; background: #000; display: flex; align-items: center; justify-content: center; }
        .modal-left img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .modal-right { flex: 1; padding: 30px; display: flex; flex-direction: column; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 2rem; cursor: pointer; color: var(--primary); z-index: 10; }
        .comment-box { flex: 1; overflow-y: auto; margin-top: 20px; border-top: 1px solid var(--card-border); padding-top: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo-nav">
            <img src="logo1.png" alt="FORUP">
        </a>
        
        <div class="nav-links">
            <a href="carte.html">Forum</a>
            <a href="concours.html">Concours</a>
            <a href="boutique.html">Boutique</a>
            <a href="galerie.html">Galerie</a>
        </div>

        <div class="nav-right">
            <a href="parametre.html" style="color: var(--primary); font-size: 1.3rem;"><i class="fa-solid fa-sliders"></i></a>
        </div>
    </nav>

    <div class="upload-section">
        <div class="upload-zone" id="drop-zone">
            <img src="logo1.png" alt="Logo" class="upload-card-logo">
            <input type="file" id="fileInput" hidden accept="image/*">
            
            <div id="upload-placeholder">
                <i class="fa-solid fa-camera" style="font-size: 2.5rem; color: var(--accent); margin-bottom: 10px;"></i>
                <h2>Partager un moment</h2>
                <p style="color: var(--text-muted)">Cliquez ici pour choisir une photo</p>
            </div>

            <div id="upload-preview">
                <div class="preview-img-container">
                    <img id="img-render" src="">
                </div>
                <div class="upload-form">
                    <input type="text" id="photo-desc" placeholder="Écrire une description...">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="is-public-check" style="width:18px; height:18px;">
                        <label for="is-public-check" style="font-weight: 700;">Rendre cette photo publique</label>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn-publish" onclick="confirmUpload()">PUBLIER</button>
                        <button onclick="resetUpload()" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-weight:600;">Annuler</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('public', this)">PUBLIC</div>
        <div class="tab" onclick="switchTab('private', this)">PRIVÉE</div>
    </div>

    <div class="grid" id="mainGrid">
        <div class="post-card" data-type="public" onclick="openModal(this)">
            <div class="img-box"><img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=500"></div>
            <div class="post-info">
                <div class="stats">
                    <span><i class="fa-solid fa-heart"></i> 12</span>
                    <span><i class="fa-solid fa-comment"></i> 3</span>
                </div>
                <p class="full-desc" hidden>Belle journée de pétanque !</p>
            </div>
        </div>
    </div>

    <div class="modal" id="photoModal" onclick="closeModal()">
        <div class="modal-container" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-left">
                <img id="modalImg" src="">
            </div>
            <div class="modal-right">
                <h3 style="margin-top:0">Description</h3>
                <p id="modalDesc" style="color: var(--text-muted); line-height: 1.5;"></p>
                <div class="comment-box" id="modalComments">
                    <p><strong>Admin :</strong> Top cette photo ! 🔥</p>
                </div>
                <button class="btn-publish" style="margin-top: 20px; background: var(--accent);">❤️ LIKER</button>
            </div>
        </div>
    </div>

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }

        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('drop-zone');
        const placeholder = document.getElementById('upload-placeholder');
        const preview = document.getElementById('upload-preview');
        const imgRender = document.getElementById('img-render');

        dropZone.onclick = (e) => {
            if(e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
                fileInput.click();
            }
        };

        fileInput.onchange = function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    imgRender.src = e.target.result;
                    placeholder.style.display = 'none';
                    preview.style.display = 'flex';
                };
                reader.readAsDataURL(file);
            }
        };

        function resetUpload() {
            placeholder.style.display = 'block';
            preview.style.display = 'none';
            fileInput.value = "";
            document.getElementById('photo-desc').value = "";
        }

        function confirmUpload() {
            const desc = document.getElementById('photo-desc').value;
            const isPublic = document.getElementById('is-public-check').checked;
            const imgSrc = imgRender.src;
            const grid = document.getElementById('mainGrid');

            if (!imgSrc) return;

            const newCard = document.createElement('div');
            newCard.classList.add('post-card');
            const type = isPublic ? 'public' : 'private';
            newCard.setAttribute('data-type', type);
            if (!isPublic) newCard.classList.add('private-style');

            newCard.innerHTML = `
                <div class="img-box"><img src="${imgSrc}"></div>
                <div class="post-info">
                    <div class="stats">
                        <span><i class="fa-solid fa-heart"></i> 0</span>
                        ${isPublic ? '<span><i class="fa-solid fa-comment"></i> 0</span>' : '<span class="private-label"><i class="fa-solid fa-lock"></i> PRIVÉ</span>'}
                    </div>
                    <p class="full-desc" hidden>${desc || "Souvenir FORUP"}</p>
                </div>
            `;

            newCard.onclick = function() { openModal(this); };
            grid.prepend(newCard); 
            resetUpload();
            switchTab(isPublic ? 'public' : 'private', document.querySelectorAll('.tab')[isPublic ? 0 : 1]);
        }

        function switchTab(type, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            
            document.querySelectorAll('.post-card').forEach(card => {
                if(type === 'public') {
                    card.style.display = (card.dataset.type === 'public') ? 'block' : 'none';
                } else {
                    card.style.display = (card.dataset.type === 'private') ? 'block' : 'none';
                }
            });
        }

        function openModal(card) {
            document.getElementById('modalImg').src = card.querySelector('img').src;
            document.getElementById('modalDesc').innerText = card.querySelector('.full-desc').innerText;
            document.getElementById('photoModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('photoModal').style.display = 'none';
        }
    </script>
</body>
</html>
