<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique - En préparation | Pétanque Online</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/shared.css">
    <style>
        :root {
            --bg-page: #f2f1e1;
        }

        body {
            background-color: var(--bg-page);
            overflow-x: hidden;
        }

        nav {
            background: rgba(255, 255, 255, 0.95);
        }

        /* --- CONTENU --- */
        .maintenance-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .maintenance-text {
            color: var(--primary);
            font-weight: 800;
            font-size: 1.8rem;
            max-width: 800px;
            text-transform: uppercase;
            margin: 0 0 20px 0;
        }

        .maintenance-img {
            max-width: 450px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .back-btn {
            display: inline-block;
            background-color: var(--primary);
            color: var(--white);
            padding: 18px 35px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 1.2rem;
            text-decoration: none;
            text-transform: uppercase;
            transition: 0.3s;
            margin-top: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .back-btn:hover {
            transform: translateY(-3px);
            background-color: var(--accent);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">
            <img src="images/logo1.png" alt="Pétanque Online Logo">
        </a>
        <div class="nav-links">
            <a href="carte.html">Forum</a>
            <a href="#">Concours</a>
            <a href="boutique.html" style="color: var(--accent);">Boutique</a>
            <a href="galerie.html">Galerie</a>
        </div>
        <div class="nav-right">
            <div class="user-menu-wrapper" id="user-menu">
                <div id="logged-out-view">
                    <a href="connexion.html" class="account-icon">
                        <i class="fa-regular fa-circle-user"></i>
                    </a>
                </div>
                <div id="logged-in-view" style="display: none;">
                    <div class="account-icon active-user">
                        <i class="fa-solid fa-circle-user"></i>
                    </div>
                    <div class="dropdown-content">
                        <a href="compte.html">Mon Profil</a>
                        <a href="parametre.html">Paramètres</a>
                        <button onclick="simulateLogout()" class="btn-logout-menu">Déconnexion</button>
                    </div>
                </div>
            </div>
            <a href="parametre.html" class="settings-icon"><i class="fa-solid fa-sliders"></i></a>
        </div>
    </nav>

    <main class="maintenance-container">
        <h1 class="maintenance-text">
            Cette page est en cours de préparation,<br>
            l'équipe Pétanque Online y travaille actuellement.
        </h1>

        <img src="images/aie.png" alt="Aïe, crocheté !" class="maintenance-img">

        <a href="index.html" class="back-btn">Retourner au menu</a>
    </main>

    <script>
        let isUserLoggedIn = false;
        function updateUI() {
            const loggedOutView = document.getElementById('logged-out-view');
            const loggedInView = document.getElementById('logged-in-view');
            if (isUserLoggedIn) {
                loggedOutView.style.display = 'none';
                loggedInView.style.display = 'block';
            } else {
                loggedOutView.style.display = 'block';
                loggedInView.style.display = 'none';
            }
        }
        function simulateLogout() {
            isUserLoggedIn = false;
            updateUI();
        }
        updateUI();
    </script>
</body>
</html>
