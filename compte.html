<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil | Pétanque Online</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --primary: #0f172a; 
            --accent: #A67B5B; 
            --white: #ffffff;
            --text-muted: #64748b;
            --shadow: 0 20px 50px rgba(0,0,0,0.05);
        }

        body { 
            margin: 0; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg); 
            color: var(--primary);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- NAVIGATION (STRICTEMENT ALIGNÉE) --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 60px;
            height: 90px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #f1f5f9;
        }

        .logo { 
            display: flex; 
            align-items: center; 
            text-decoration: none;
            width: 150px; /* Largeur identique pour éviter le décalage */
        }
        
        /* TAILLE DU LOGO FIXÉE À 40PX */
        .logo img { 
            height: 40px; 
            width: auto; 
            display: block;
        }

        .nav-links { 
            display: flex; 
            gap: 40px; 
            flex: 1; 
            justify-content: center; 
        }
        .nav-links a { text-decoration: none; color: var(--primary); font-weight: 600; font-size: 1.1rem; transition: 0.3s; }
        .nav-links a:hover { color: var(--accent); }
        
        .nav-right { 
            display: flex; 
            gap: 20px; 
            align-items: center; 
            width: 150px; /* Largeur identique pour l'équilibre */
            justify-content: flex-end;
        }

        /* --- MENU COMPTE DYNAMIQUE --- */
        .user-menu-wrapper { position: relative; display: inline-block; }
        .account-icon { font-size: 1.8rem; color: var(--primary); text-decoration: none; transition: 0.3s; cursor: pointer; display: flex; align-items: center; }
        .account-icon:hover, .account-icon.active-user { color: var(--accent); }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background-color: white;
            min-width: 180px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.1);
            border-radius: 15px;
            overflow: hidden;
            margin-top: 15px;
            border: 1px solid #f1f5f9;
        }

        .dropdown-content a, .dropdown-content button {
            color: var(--primary);
            padding: 12px 20px;
            text-decoration: none;
            display: block;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            width: 100%;
            border: none;
            background: none;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }
        .dropdown-content a:hover, .dropdown-content button:hover { background-color: #f8fafc; color: var(--accent); }
        .btn-logout-menu { border-top: 1px solid #f1f5f9 !important; color: #ef4444 !important; }
        .user-menu-wrapper:hover .dropdown-content { display: block; }

        /* --- LAYOUT COMPTE --- */
        .profile-container {
            max-width: 1100px;
            margin: 50px auto;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
            padding: 0 20px;
            flex: 1;
        }

        .profile-sidebar, .profile-main {
            background: var(--white);
            border-radius: 30px;
            padding: 40px;
            box-shadow: var(--shadow);
            height: fit-content;
        }

        /* --- SIDEBAR --- */
        .profile-info { text-align: center; }
        .avatar-wrapper { position: relative; width: 150px; height: 150px; margin: 0 auto 20px; }
        .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid var(--accent); }
        .change-photo-btn { position: absolute; bottom: 5px; right: 5px; background: var(--accent); color: white; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 3px solid white; }
        .profile-name { font-size: 1.5rem; font-weight: 800; margin: 10px 0 5px; }
        .profile-role { color: #64748b; font-size: 0.9rem; margin-bottom: 20px; display: block; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; border-top: 1px solid #f1f5f9; padding-top: 20px; }
        .stat-item span { display: block; font-weight: 800; font-size: 1.2rem; color: var(--accent); }
        .stat-item label { font-size: 0.75rem; text-transform: uppercase; color: #64748b; font-weight: 700; }

        /* --- MAIN --- */
        .profile-main h2 { font-weight: 800; margin-top: 0; margin-bottom: 30px; }
        .settings-group { margin-bottom: 30px; }
        .settings-group h3 { font-size: 1rem; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; margin-bottom: 20px; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
        .field { display: flex; flex-direction: column; }
        .field label { font-weight: 600; font-size: 0.85rem; margin-bottom: 8px; color: #64748b; }
        .field input { padding: 12px 15px; border-radius: 12px; border: 2px solid #f1f5f9; font-family: inherit; font-size: 0.95rem; }
        .field input:focus { outline: none; border-color: var(--accent); }

        .btn-save { background: var(--accent); color: white; border: none; padding: 15px 30px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-save:hover { background: #8d664a; transform: translateY(-2px); }
        .danger-zone { margin-top: 40px; padding-top: 20px; border-top: 2px dashed #fee2e2; }
        .btn-delete { color: #ef4444; background: none; border: none; font-weight: 700; cursor: pointer; padding: 0; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">
            <img src="images/logo1.png" alt="Pétanque Online Logo">
        </a>
        <div class="nav-links">
            <a href="carte.html">Forum</a>
            <a href="#">Concours</a>
            <a href="boutique.html">Boutique</a>
            <a href="galerie.html">Galerie</a>
        </div>
        <div class="nav-right">
            <div class="user-menu-wrapper">
                <div class="account-icon active-user">
                    <i class="fa-solid fa-circle-user"></i>
                </div>
                <div class="dropdown-content">
                    <a href="index.html">Accueil</a>
                    <button onclick="logout()" class="btn-logout-menu">Déconnexion</button>
                </div>
            </div>
            <a href="parametre.html" style="color: var(--primary); font-size: 1.5rem;"><i class="fa-solid fa-sliders"></i></a>
        </div>
    </nav>

    <div class="profile-container">
        <aside class="profile-sidebar">
            <div class="profile-info">
                <div class="avatar-wrapper">
                    <img src="https://ui-avatars.com/api/?name=Dorian+Tanguy&background=A67B5B&color=fff&size=150" alt="Profil" class="avatar-img" id="profile-pic">
                    <label for="file-upload" class="change-photo-btn">
                        <i class="fa-solid fa-camera"></i>
                    </label>
                    <input type="file" id="file-upload" style="display:none" onchange="previewImage(event)">
                </div>
                <h1 class="profile-name">Dorian Tanguy</h1>
                <span class="profile-role">Membre de la famille depuis 2026</span>
                <div class="stats-grid">
                    <div class="stat-item"><span>24</span><label>Concours</label></div>
                    <div class="stat-item"><span>12</span><label>Photos</label></div>
                </div>
            </div>
        </aside>

        <main class="profile-main">
            <h2>Paramètres du compte</h2>
            <form id="profile-form">
                <div class="settings-group">
                    <h3>Informations personnelles</h3>
                    <div class="input-row">
                        <div class="field"><label>Nom complet</label><input type="text" value="Dorian Tanguy"></div>
                        <div class="field"><label>Adresse Email</label><input type="email" value="tanguy.dorian9@gmail.com"></div>
                    </div>
                </div>
                <div class="settings-group">
                    <h3>Sécurité</h3>
                    <div class="input-row">
                        <div class="field"><label>Nouveau mot de passe</label><input type="password" placeholder="••••••••"></div>
                        <div class="field"><label>Confirmer le mot de passe</label><input type="password" placeholder="••••••••"></div>
                    </div>
                </div>
                <button type="submit" class="btn-save">Enregistrer les modifications</button>
            </form>
            <div class="danger-zone"><button class="btn-delete">Désactiver mon compte</button></div>
        </main>
    </div>

    <script>
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function(){ document.getElementById('profile-pic').src = reader.result; };
            reader.readAsDataURL(event.target.files[0]);
        }

        function logout() {
            alert("Déconnexion...");
            window.location.href = "index.html";
        }

        document.getElementById('profile-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert("Modifications enregistrées !");
        });
    </script>
</body>
</html>
