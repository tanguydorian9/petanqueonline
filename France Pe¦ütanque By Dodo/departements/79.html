<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deux-Sèvres (79) - Communauté Pétanque</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* --- STYLES GÉNÉRAUX --- */
        body {
            font-family: 'Outfit', sans-serif; margin: 0; padding: 0; height: 100vh; overflow-x: hidden;
            color: #2d3436;
            background: linear-gradient(-45deg, #eef2f3, #8e9eab, #eef2f3);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .app-layout {
            display: grid; grid-template-columns: 320px 1fr; gap: 40px;
            max-width: 1200px; margin: 40px auto; padding: 0 20px;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        .sidebar { padding: 40px 30px; text-align: center; height: fit-content; position: sticky; top: 40px; }

        .dept-number {
            font-size: 6em; font-weight: 800; line-height: 0.9; margin-bottom: 10px;
            background: linear-gradient(45deg, #0984e3, #00cec9);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .dept-name { font-size: 1.8em; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; }

        .btn-home {
            display: inline-block; margin-bottom: 20px; text-decoration: none;
            color: #636e72; font-weight: 500; background: white;
            padding: 8px 20px; border-radius: 20px; transition: 0.3s;
        }
        .btn-home:hover { transform: scale(1.05); color: #0984e3; }

        .weather-widget {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            color: white; padding: 20px; border-radius: 15px; margin-top: 20px;
            text-align: left; position: relative; overflow: hidden;
            box-shadow: 0 10px 20px rgba(9, 132, 227, 0.3);
        }
        .weather-temp { font-size: 2.5em; font-weight: 800; line-height: 1; }
        .weather-icon { font-size: 3em; opacity: 0.9; }
        .weather-location { font-size: 0.8em; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; }

        .btn-join {
            margin-top: 25px; width: 100%; padding: 15px; border: none; border-radius: 15px;
            background: linear-gradient(45deg, #0984e3, #00cec9);
            color: white; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.1em;
            text-transform: uppercase; cursor: pointer; transition: 0.3s;
        }
        .btn-leave {
            margin-top: 15px; width: 100%; padding: 10px; border: 2px solid #ff7675; border-radius: 15px;
            background: transparent; color: #ff7675; font-weight: 700; cursor: pointer; display: none;
        }

        .topic {
            padding: 25px; margin-bottom: 25px; position: relative;
            animation: slideUp 0.5s ease-out forwards; opacity: 0;
        }
        @keyframes slideUp { from {opacity:0; transform:translateY(30px);} to {opacity:1; transform:translateY(0);} }
        .tag { font-size: 0.7em; font-weight: 800; text-transform: uppercase; padding: 5px 12px; border-radius: 30px; }
        .tag-Tournoi { background: #dff9fb; color: #130f40; } .tag-Terrain { background: #fefce8; color: #d35400; }
        .tag-Vente { background: #ffeaa7; color: #6c5ce7; } .tag-Autre { background: #dfe6e9; color: #636e72; }
        
        .user-avatar { width: 35px; height: 35px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); color: white; display: flex; align-items: center; justify-content: center; margin-right: 10px; }
        
        .fab { position: fixed; bottom: 40px; right: 40px; background: white; color: #0984e3; width: 70px; height: 70px; border-radius: 50%; font-size: 35px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.2); cursor: pointer; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 200; }
        .form-input { width: 100%; padding: 15px; margin-bottom: 15px; border: 2px solid #f1f2f6; border-radius: 12px; font-family: inherit; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="app-layout">
        <aside class="sidebar glass-panel">
            <a href="../index.html" class="btn-home">⬅ Carte</a>
            <div class="dept-number">79</div>
            <div class="dept-name">Deux-Sèvres</div>
            
            <div class="weather-widget glass-panel" style="border:none; color:white;">
                <span class="weather-location">Niort <span style="background:#ff7675; padding:2px 5px; border-radius:4px; font-size:0.7em;">LIVE</span></span>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div class="weather-temp" id="w-temp">--°</div>
                    <div class="weather-icon" id="w-icon">⏳</div>
                </div>
                <div id="w-text" style="font-size:0.9em; margin-top:5px;">Chargement...</div>
            </div>

            <button id="btnJoin" class="btn-join">🎉 Rejoindre l'équipe</button>
            <button id="btnLeave" class="btn-leave">💔 Quitter l'équipe</button>

            <div style="margin-top: 30px; font-size: 0.9em; color: #aaa;">
                <strong style="color:#2d3436; font-size: 1.2em;" id="topic-count">0</strong> sujets actifs
            </div>
            <br>
            <button onclick="clearAll()" style="border:none;background:none;color:#ff7675;cursor:pointer;font-size:0.8em;text-decoration:underline;">Tout supprimer</button>
        </aside>

        <main>
            <h2 class="feed-title">Les discussions des Deux-Sèvres 💬</h2>
            <div id="feed-container"></div>
        </main>
    </div>

    <button class="fab" onclick="openModal()">+</button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="glass-panel" style="padding: 40px; width: 90%; max-width: 500px; position:relative;">
            <button onclick="closeModal()" style="position:absolute; top:20px; right:20px; border:none; background:none; font-size:1.5em; cursor:pointer;">×</button>
            <h2 style="margin-top:0;">Lancer une discussion (79)</h2>
            <form id="newTopicForm">
                <input type="text" id="inputPseudo" class="form-input" placeholder="Votre pseudo" required>
                <select id="inputTag" class="form-input">
                    <option value="Autre">Catégorie...</option>
                    <option value="Tournoi">🏆 Tournoi</option>
                    <option value="Terrain">📍 Terrain</option>
                    <option value="Vente">💰 Vente</option>
                    <option value="Autre">💬 Autre</option>
                </select>
                <input type="text" id="inputTitre" class="form-input" placeholder="Titre" required>
                <textarea id="inputMessage" rows="3" class="form-input" placeholder="Votre message..." required></textarea>
                <button type="submit" style="width:100%; padding:15px; background:#0984e3; color:white; border:none; border-radius:12px; font-weight:bold; cursor:pointer;">Poster 🚀</button>
            </form>
        </div>
    </div>

    <script>
        const DEPT_CODE = '79';
        const LAT = '46.32';
        const LON = '-0.46';

        document.addEventListener('DOMContentLoaded', () => {
            loadTopics();
            fetchRealWeather();
            if(localStorage.getItem('isMember_' + DEPT_CODE) === 'true') { setMemberState(true); }
        });

        async function fetchRealWeather() {
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current_weather=true`);
                const data = await response.json();
                const temp = Math.round(data.current_weather.temperature);
                const code = data.current_weather.weathercode;
                
                let icon = '☁️'; let text = 'Ciel variable';
                if (code === 0) { icon = '☀️'; text = 'Beau soleil sur Niort !'; }
                else if (code >= 51 && code <= 67) { icon = '🌧️'; text = 'Pluie sur les terrains.'; }

                document.getElementById('w-temp').innerText = temp + "°C";
                document.getElementById('w-icon').innerText = icon;
                document.getElementById('w-text').innerText = text;
            } catch (e) { document.getElementById('w-text').innerText = "Météo indisponible"; }
        }

        function loadTopics() {
            const container = document.getElementById('feed-container');
            container.innerHTML = "";
            let topics = JSON.parse(localStorage.getItem('topics_' + DEPT_CODE)) || [];
            if (topics.length === 0) {
                topics.push({ id: Date.now(), pseudo: "Admin", tag: "Autre", titre: "Bienvenue dans le 79 !", message: "Alors, ça joue vers le Marais Poitevin ?", likes: 2 });
            }
            topics.slice().reverse().forEach(t => {
                const initial = t.pseudo.charAt(0).toUpperCase();
                const html = `
                <div class="glass-panel topic" id="${t.id}">
                    <div style="display:flex; justify-content:space-between;">
                        <span class="tag tag-${t.tag}">${t.tag}</span>
                        <button style="background:none; border:none; color:#ff7675; cursor:pointer;" onclick="deleteTopic(${t.id})">✖</button>
                    </div>
                    <h3>${t.titre}</h3>
                    <p>${t.message}</p>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:15px; border-top:1px solid #eee; padding-top:10px; font-size:0.9em;">
                        <div style="display:flex; align-items:center;"><div class="user-avatar">${initial}</div> ${t.pseudo}</div>
                        <span>❤️ ${t.likes || 0}</span>
                    </div>
                </div>`;
                container.insertAdjacentHTML('beforeend', html);
            });
            document.getElementById('topic-count').innerText = topics.length;
        }

        document.getElementById('newTopicForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const newTopic = {
                id: Date.now(),
                pseudo: document.getElementById('inputPseudo').value,
                tag: document.getElementById('inputTag').value,
                titre: document.getElementById('inputTitre').value,
                message: document.getElementById('inputMessage').value,
                likes: 0
            };
            let topics = JSON.parse(localStorage.getItem('topics_' + DEPT_CODE)) || [];
            topics.push(newTopic);
            localStorage.setItem('topics_' + DEPT_CODE, JSON.stringify(topics));
            loadTopics(); closeModal(); this.reset();
        });

        const btnJoin = document.getElementById('btnJoin');
        const btnLeave = document.getElementById('btnLeave');

        btnJoin.addEventListener('click', () => {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            setMemberState(true);
            localStorage.setItem('isMember_' + DEPT_CODE, 'true');
        });

        btnLeave.addEventListener('click', () => {
            if(confirm("Quitter la team des Deux-Sèvres ?")) {
                setMemberState(false);
                localStorage.setItem('isMember_' + DEPT_CODE, 'false');
            }
        });

        function setMemberState(is) {
            btnJoin.style.display = is ? 'none' : 'block';
            btnLeave.style.display = is ? 'block' : 'none';
        }

        function deleteTopic(id) {
            let topics = JSON.parse(localStorage.getItem('topics_' + DEPT_CODE)) || [];
            topics = topics.filter(t => t.id !== id);
            localStorage.setItem('topics_' + DEPT_CODE, JSON.stringify(topics));
            loadTopics();
        }

        function clearAll() { if(confirm("Tout effacer ?")) { localStorage.removeItem('topics_' + DEPT_CODE); loadTopics(); } }
        const modal = document.getElementById('modalOverlay');
        function openModal() { modal.style.display = 'flex'; }
        function closeModal() { modal.style.display = 'none'; }
    </script>
</body>
</html>
